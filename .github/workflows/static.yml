# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Alineado con el Node de desarrollo local (24.x). Cuando esto decía
          # 20, el CI corría npm 10 y local npm 11: el lockfile que generaba
          # local pasaba `npm ci` acá pero era RECHAZADO allá. Mantener el mismo
          # major evita esa clase de fallo, que solo aparece en CI y confunde
          # (el diagnóstico obvio —"el lockfile está desincronizado"— no era la
          # causa: el lockfile estaba INCOMPLETO).
          node-version: 24
          cache: npm
      - name: Install dependencies
        # `npm ci` (no `npm install`) A PROPÓSITO: falla si el lockfile no
        # describe exactamente el árbol de package.json, que es justo la
        # garantía de reproducibilidad que se quiere en un deploy. Cambiarlo a
        # `npm install` "para que pase" esconde el problema y hace que
        # producción se construya con dependencias distintas a las probadas.
        run: npm ci
      - name: Parser de ingesta sincronizado
        # La Edge Function ingest-taxiparks lleva una COPIA de
        # src/domain/taxiparks.ts (no puede importar de src/). Si alguien edita
        # el original y no corre `npm run sync:ingest`, la carga automática
        # empezaría a parsear distinto que la manual — en silencio.
        run: npm run sync:ingest -- --check
      - name: Typecheck
        run: npm run typecheck
      - name: Chequeos de deriva (acciones + columnas)
        # Dos clases de bug que el compilador NO ve y que ya vivieron semanas en
        # produccion: un data-act sin handler (el control no hace nada, sin error
        # de consola) y una columna que ninguna lista pide (la vista muestra "-"
        # para siempre). Estaban documentados en CLAUDE.md como greps manuales.
        run: npm run check:drift
      - name: Tests del núcleo de cálculo
        # Los tests de src/domain fijan reglas de negocio (snapshot vs flujo,
        # proyecciones, ponderados). Corrían solo a mano; acá el deploy se
        # detiene si un cálculo cambia de significado sin querer.
        run: npm test
      - name: Build
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # index.html referencia módulos ES con imports "bare" (npm) — sin
          # este build, GitHub Pages sirve el JS crudo y el navegador no puede
          # resolverlos (la SPA nunca arranca: botones muertos, nada renderiza).
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

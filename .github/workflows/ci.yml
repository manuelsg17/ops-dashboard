# CI — chequeos de calidad en cada push a main.
#
# DESDE EL 24-SEP-2026 EL DEPLOY ES SOLO VERCEL (decisión de Manuel): Vercel
# construye y publica solo cada push a main (ver vercel.json). Este workflow
# era el deploy a GitHub Pages; se quitó la parte de publicar y se conservaron
# los chequeos, que Vercel no corre (Vercel solo hace `npm run build`). Si un
# chequeo falla acá, Vercel IGUAL publica: mirar el estado de este workflow
# después de cada push (gh run list).
name: CI (chequeos)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Alineado con el Node de desarrollo local (24.x). Cuando esto decía
          # 20, el CI corría npm 10 y local npm 11: el lockfile que generaba
          # local pasaba `npm ci` acá pero era RECHAZADO allá. Mantener el mismo
          # major evita esa clase de fallo, que solo aparece en CI y confunde
          # (el diagnóstico obvio —"el lockfile está desincronizado"— no era la
          # causa: el lockfile estaba INCOMPLETO).
          node-version: 24
          cache: npm
      - name: Install dependencies
        # `npm ci` (no `npm install`) A PROPÓSITO: falla si el lockfile no
        # describe exactamente el árbol de package.json, que es justo la
        # garantía de reproducibilidad que se quiere en un deploy. Cambiarlo a
        # `npm install` "para que pase" esconde el problema y hace que
        # producción se construya con dependencias distintas a las probadas.
        run: npm ci
      - name: Parser de ingesta sincronizado
        # La Edge Function ingest-taxiparks lleva una COPIA de
        # src/domain/taxiparks.ts (no puede importar de src/). Si alguien edita
        # el original y no corre `npm run sync:ingest`, la carga automática
        # empezaría a parsear distinto que la manual — en silencio.
        run: npm run sync:ingest -- --check
      - name: Lint
        # oxlint en vez de ESLint: typescript-eslint no soporta TypeScript 7
        # (peer <6.1.0) y forzarlo con --legacy-peer-deps deja un arbol roto.
        # oxlint parsea TS de forma nativa, sin depender del paquete typescript.
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Chequeos de deriva (acciones + columnas)
        # Dos clases de bug que el compilador NO ve y que ya vivieron semanas en
        # produccion: un data-act sin handler (el control no hace nada, sin error
        # de consola) y una columna que ninguna lista pide (la vista muestra "-"
        # para siempre). Estaban documentados en CLAUDE.md como greps manuales.
        run: npm run check:drift
      - name: Tests del núcleo de cálculo
        # Los tests de src/domain fijan reglas de negocio (snapshot vs flujo,
        # proyecciones, ponderados). Si un cálculo cambia de significado sin
        # querer, este workflow queda en rojo (Vercel publica igual: revisarlo).
        run: npm test
      - name: Build
        run: npm run build
